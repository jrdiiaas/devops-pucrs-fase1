name: CI/CD Pipeline - Build, Test, Security, IaC, Docker & Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: 1. Build, Lint, SAST e Testes Unitários
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código-fonte
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar padronização de código (Flake8 Lint)
        run: |
          flake8 app/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics

      - name: Análise de Segurança Estática DevSecOps (Bandit SAST)
        run: |
          bandit -r app/ -ll

      - name: Executar Testes Automatizados (Pytest)
        run: |
          python -m pytest -v

  validate-iac:
    name: 2. Validação da Infraestrutura como Código (Terraform)
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout do código-fonte
        uses: actions/checkout@v4

      - name: Configurar HashiCorp Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"

      - name: Inicializar Terraform (sem backend remoto)
        working-directory: ./iac
        run: terraform init -backend=false

      - name: Validar sintaxe dos scripts IaC
        working-directory: ./iac
        run: terraform validate

  docker-build-test:
    name: 3. Build e Orquestração de Container (Docker & Compose)
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout do código-fonte
        uses: actions/checkout@v4

      - name: Validar manifesto de orquestração Docker Compose
        run: docker compose config -q

      - name: Build da Imagem Docker
        run: docker build -t devops-pucrs-api:latest .

      - name: Subir Container e Testar Endpoints de Saúde e Métricas
        run: |
          docker run -d --name api-test -p 5000:5000 devops-pucrs-api:latest
          sleep 4
          curl --fail http://localhost:5000/health
          curl --fail http://localhost:5000/metrics
          docker stop api-test

  continuous-delivery:
    name: 4. Entrega Contínua (CD) - Deploy Automatizado e Smoke Test
    runs-on: ubuntu-latest
    needs: [build-and-test, validate-iac, docker-build-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout do código-fonte
        uses: actions/checkout@v4

      - name: Executar Script de Deploy Automatizado com Containers (CD)
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          bash scripts/deploy.sh "${IMAGE_TAG}"

      - name: Validar Logs de Monitoramento do Container em Produção
        run: |
          docker logs devops-pucrs-api
          docker stop devops-pucrs-api
