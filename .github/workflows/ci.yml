name: CI Pipeline - Build, Test, IaC & Docker

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: 1. Build, Lint e Testes Unitários
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código-fonte
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar padronização de código (Flake8 Lint)
        run: |
          flake8 app/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics

      - name: Executar Testes Automatizados (Pytest)
        run: |
          pytest -v

  validate-iac:
    name: 2. Validação da Infraestrutura como Código (Terraform)
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout do código-fonte
        uses: actions/checkout@v4

      - name: Configurar HashiCorp Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"

      - name: Inicializar Terraform (sem backend remoto)
        working-directory: ./iac
        run: terraform init -backend=false

      - name: Validar sintaxe dos scripts IaC
        working-directory: ./iac
        run: terraform validate

  docker-build-test:
    name: 3. Build e Teste de Container Docker
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout do código-fonte
        uses: actions/checkout@v4

      - name: Build da Imagem Docker
        run: docker build -t devops-pucrs-api:latest .

      - name: Subir Container e Testar Endpoint de Saúde
        run: |
          docker run -d --name api-test -p 5000:5000 devops-pucrs-api:latest
          sleep 4
          curl --fail http://localhost:5000/health
          docker stop api-test
